<!doctype html>
<meta charset="utf-8">
<title>PDF Notes</title>
<style>
  body{margin:0;font:14px -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;height:100vh;background:#e9e9ec;color:#222}
  #bar{display:flex;gap:6px;align-items:center;padding:6px 10px;background:#fff;border-bottom:1px solid #ccc;flex-wrap:wrap}
  button,input,select{font:inherit}
  button{padding:4px 10px;border:1px solid #bbb;border-radius:6px;background:#f6f6f6;cursor:pointer}
  button.on{background:#222;color:#fff;border-color:#222}
  #pn{width:48px;text-align:center}
  #lib{max-width:200px}
  #main{flex:1;display:flex;min-height:0}
  #view{flex:1;overflow:auto;padding:16px 16px 60vh 40px;position:relative}
  #pages{--w:900px}
  .pg{position:relative;margin:0 auto 14px;background:#fff;box-shadow:0 2px 12px #0003;width:var(--w)}
  .pg img{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
  .pg svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  .pg svg.type{cursor:crosshair} .pg svg.pen{cursor:cell} .pg svg.hl{cursor:text} .pg svg.crop{cursor:copy} body.scroll .pg svg{touch-action:pan-y pinch-zoom} .pg svg.lasso{cursor:crosshair} .pg svg.space{cursor:row-resize} .pg svg.erase{cursor:not-allowed}
  #pages.g{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px}
  #pages.g .pg{width:auto;margin:0}
  #pages.g .lbl{left:2px;top:2px;background:#fffd;padding:0 4px;border-radius:3px;pointer-events:auto;cursor:zoom-in;z-index:2}
  body.sepia .pg{background:#f4ecd8} body.sepia .pg img{filter:sepia(.35) contrast(.95)}
  body.sepia #view{background:#d9cfb8}
  body.dark{background:#1b1b1d;color:#ddd}
  body.dark .pg img{filter:invert(.92) hue-rotate(180deg)}
  body.dark .pg{background:#111}
  body.dark .pg svg rect{mix-blend-mode:normal !important;fill-opacity:.32 !important}
  body.dark #view{background:#2a2a2d}
  body.dark #bar,body.dark #side,body.dark #nav,body.dark #thumbs,body.dark #bms,body.dark #nts,body.dark #tabs button.on{background:#222;color:#ddd;border-color:#444}
  body.dark button,body.dark select,body.dark input,body.dark textarea{background:#333;color:#eee;border-color:#555}
  body.dark .note,body.dark .u{border-color:#444} body.dark .u:hover{background:#2c2c2c}
  body.dark .q{color:#bbb}
  .cz{background:#ccc;color:transparent;border-radius:3px;user-select:none} body.dark .cz{background:#555}
  #rc mark{background:#ffe14d;color:#000;padding:0 2px;border-radius:2px}
  .ca{border-top:1px dashed #aaa;padding-top:8px;margin-top:12px;color:#444} body.dark .ca{color:#bbb}
  #dock{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px}
  #dk,#rp{display:flex;gap:6px;align-items:center;background:#fffe;border:1px solid #bbb;border-radius:10px;padding:5px 8px;box-shadow:0 2px 10px #0003}
  body.dark #dk,body.dark #rp{background:#222e;border-color:#555}
  #rp b{min-width:34px;text-align:center}
  .lbl{position:absolute;left:-30px;top:2px;color:#888;font-size:11px}
  #nav{width:190px;background:#fafafa;border-right:1px solid #ccc;display:flex;flex-direction:column;min-height:0}
  #tabs{display:flex}
  #tabs button{flex:1;border:0;border-bottom:2px solid transparent;border-radius:0;background:none}
  #tabs button.on{border-color:#222;background:#fff;color:#222}
  #nav.wide{width:300px}
  #nts{flex:1;overflow:auto;padding:8px;min-height:0}
  .u{border:1px solid #ddd;border-left:4px solid var(--c);border-radius:4px;padding:5px 6px;margin-bottom:8px;cursor:pointer}
  .u:hover{background:#f3f3f3}
  .u .q{max-height:none;margin:0 0 4px;border:0;padding:0}
  .u p{margin:0 0 4px;white-space:pre-wrap}
  .u small{color:#777}
  .u button{float:right;padding:0 6px}
  dialog{border:1px solid #888;border-radius:8px;padding:12px;max-width:90vw}
  #lb{width:760px;height:80vh}
  #lb[open]{display:flex;flex-direction:column}
  #lbh{display:flex;gap:6px;margin-bottom:8px}
  #lq{flex:1}
  #ll{flex:1;overflow:auto}
  #ll h4{margin:12px 0 6px}
  #bi label{display:flex;gap:6px;margin:4px 0;align-items:center}
  #bi label span{width:70px}
  #bi input{flex:1}
  .tg{width:100%;box-sizing:border-box;margin-top:4px}
  .u .tags{color:#06c}
  #thumbs,#bms{flex:1;overflow:auto;padding:8px;min-height:0}
  .th{position:relative;margin:0 auto 10px;width:130px;border:2px solid transparent;cursor:pointer;background:#fff;box-shadow:0 1px 4px #0003}
  .th.cur{border-color:#3b82f6}
  .th img{display:block;width:100%}
  .th span{position:absolute;bottom:2px;right:4px;font-size:11px;background:#fffc;padding:0 3px}
  .th b{position:absolute;top:0;left:3px;color:#e0a800;text-shadow:0 0 2px #fff}
  #bmadd{display:flex;gap:4px;margin-bottom:8px}
  #bmt{flex:1;min-width:0}
  .bm{display:flex;gap:4px;align-items:center;padding:3px 4px;border-radius:4px;cursor:pointer}
  .bm:hover{background:#eee}
  .bm .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bm small{color:#777}
  .bm button{padding:0 5px;border:0;background:none;color:#a00}
  [hidden]{display:none!important}
  body.nonav #nav,body.noside #side,body.nonav #rzn,body.noside #rzs{display:none}
  body.nobar #bar>:not(#tbar):not(#tnav):not(#tside):not(#st){display:none}
  .rz{width:5px;flex:none;cursor:col-resize;background:#0000;margin:0 -2px;z-index:5}
  .rz:hover,.rz.d{background:#3b82f680}
  #side{width:320px;overflow:auto;background:#fff;border-left:1px solid #ccc;padding:8px}
  .note{border:1px solid #ddd;border-radius:6px;padding:6px;margin-bottom:8px}
  .note.c textarea,.note.c .tg,.note.c .kc{display:none}
  .note.c .nh{margin-bottom:0}
  .note.c .q{max-height:1.5em;white-space:nowrap;text-overflow:ellipsis;margin:4px 0 0}
  #fold{position:sticky;top:-8px;z-index:2;display:flex;gap:6px;margin:-8px -8px 8px;padding:6px 8px;background:inherit;border-bottom:1px solid #ccc}
  .note.act{border-color:#e6a800;box-shadow:0 0 0 2px #ffd95a}
  .note textarea{width:100%;box-sizing:border-box;min-height:48px;font:inherit}
  .nh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;cursor:pointer}
  .nh small{color:#777}
  .q{font-style:italic;color:#555;margin:0 0 4px;border-left:4px solid var(--c);padding-left:6px;max-height:4.5em;overflow:hidden}
  #empty{margin:80px auto;text-align:center;color:#555}
  #st{margin-left:auto;color:#777}
  #sr{width:820px;height:78vh}
  #sr[open]{display:flex;flex-direction:column}
  #so{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px;color:#555}
  .chip{display:inline-block;padding:1px 8px;margin:0 4px 4px 0;border-radius:10px;border:2px solid transparent;cursor:pointer;color:#000}
  .chip.off{opacity:.35}
  .ctx{color:#777} .sc{font-weight:600}
  .ch{margin:14px 0 4px;padding:3px 6px;background:#eee;border-radius:4px;font-weight:600} body.dark .ch{background:#333}
  #hb{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px;align-items:center;background:#fffe;border:1px solid #bbb;border-radius:10px;padding:4px 8px;box-shadow:0 2px 10px #0003}
  body.dark #hb{background:#222e;border-color:#555}
</style>

<div id="bar">
  <button id="tnav" title="Show/hide the left panel (pages, bookmarks, notes)">◧</button>
  <button id="tbar" title="Collapse/expand this toolbar">▔</button>
  <button id="open">Open PDF…</button>
  <select id="lib" title="Working copies in books/"></select>
  <button id="prev">◀</button>
  <input id="pn" value="1"> / <span id="tot">–</span>
  <button id="next">▶</button>
  <button id="zo">−</button><button id="zi">+</button>
  <select id="cols" title="Pages per row — overview of many pages at once. Click a page number to zoom to it."><option value="1">1 / row</option><option>2</option><option>3</option><option>4</option><option>6</option><option>8</option></select>
  <span style="width:12px"></span>
  <select id="theme" title="Page tint"><option value="">Light</option><option value="sepia">Sepia</option><option value="dark">Dark</option></select>
  <button id="t-scroll" title="Touch screens: ON = finger scrolls the pages; OFF = finger/Pencil draws and highlights">✋ Scroll</button>
  <button id="t-hl" class="on" title="Drag across text to highlight; click a highlight to remove it">▮ Highlight</button>
  <select id="hcol">
    
  </select>
  <button id="kedit" title="Choose highlight colours and what each one means">🎨</button>
  <button id="t-type" title="Drag a region, then type">⌨ Type note</button>
  <button id="t-crop" title="Drag a region of the page to copy it as a picture you can move/resize. You can also paste a screenshot with ⌘V.">✂ Crop</button>
  <button id="t-pen" title="Handwrite; attaches to the region it starts in">✎ Handwrite</button>
  <input type="color" id="col" value="#1a3fd0">
  <select id="pst" title="Pen style"><option value="pen">Pen</option><option value="marker">Marker</option><option value="hi">Highlighter</option></select>
  <select id="shp" title="Draw a shape instead of freehand (uses the Handwrite tool)"><option value="">Freehand</option><option value="line">╲ Line</option><option value="arrow">➘ Arrow</option><option value="darrow">⤡ Double arrow</option><option value="rect">▭ Rectangle</option><option value="ellipse">⬭ Ellipse</option><option value="tri">△ Triangle</option><option value="dia">◇ Diamond</option></select>
  <button id="t-lasso" title="Drag a loop around notes/pictures/drawings to select them; drag the selection to move it, Delete removes it">◌ Lasso</button>
  <button id="t-space" title="Press where you want room, drag down: everything below on this page moves down">⇳ Insert space</button>
  <button id="t-erase" title="Drag over handwriting / shapes to erase them">⌫ Eraser</button>
  <button id="undo" title="⌘Z">Undo stroke</button>
  <button id="bmq" title="Bookmark this page (⌘D)">☆ Bookmark</button>
  <label><input type="checkbox" id="all"> all pages</label>
  <button id="del" title="Delete the current page (notes on it go too)">Delete page</button>
  <span title="Blank margin on the right for notes, as % of the page width. 0 removes it. Costs no file size."><input id="mpc" type="number" min="0" max="300" step="5" value="33" style="width:52px">%
    <button id="mpg" title="Set the margin on this page">▥ Margin: page</button><button id="mal" title="Set the margin on every page">all</button></span>
  <button id="addb">+ Blank after</button>
  <button id="addp">+ PDF pages after…</button>
  <button id="rest" title="Restore PDF + notes from before the last page edit" hidden>Undo page edit</button>
  <button id="bib" title="Title / authors / DOI / citation key for this book">ⓘ Book info</button>
  <button id="libb" title="All highlights + comments from every book, searchable">📚 Library</button>
  <select id="nup" title="Export the whole book as a small n-up PDF (many pages per sheet, text stays sharp)"><option value="">Export n-up PDF…</option><option value="2x2">2×2 · 4 per sheet</option><option value="3x3">3×3 · 9 per sheet</option><option value="4x4">4×4 · 16 per sheet</option><option value="4x8">4×8 · 32 per sheet</option></select>
  <button id="revb" title="Quiz yourself on highlights that are due today">🧠 Review</button>
  <button id="srch" title="Search text in the book and in your notes (⌘F)">🔍 Search</button>
  <select id="ocr" title="Make a scanned book searchable (adds a text layer to pages that have none)"><option value="">OCR scanned pages…</option><option value="eng">English</option><option value="hin+eng">Hindi + English</option><option value="san+hin+eng">Sanskrit + Hindi + English</option></select>
  <select id="optz" title="Shrink the file. Your notes, highlights and bookmarks are kept."><option value="">Optimize file…</option><option value="lossless">Lossless (same quality, drops waste)</option><option value="small">Smaller (images capped at 150 dpi)</option></select>
  <button id="exp">Export PDF with notes</button>
  <span id="st"></span>
  <button id="tside" title="Show/hide the right panel (comments)">◨</button>
</div>
<div id="main">
  <div id="nav">
    <div id="tabs"><button id="tab-th" class="on">Pages</button><button id="tab-bm">Bookmarks</button><button id="tab-nt">Notes</button></div>
    <div id="thumbs"></div>
    <div id="nts" hidden>
      <button id="cpall" title="Copy every highlight + comment, in page order">Copy all</button>
      <div id="ntl"></div>
    </div>
    <div id="bms" hidden>
      <div id="bmadd"><input id="bmt" placeholder="Title (optional)"><button id="bma" title="Bookmark the current page (⌘D)">＋</button></div>
      <div id="bml"></div>
    </div>
  </div>
  <div class="rz" id="rzn"></div>
  <div id="view">
    <div id="empty" hidden>Click <b>Open PDF…</b> to start.</div>
    <div id="pages"></div>
  </div>
  <div class="rz" id="rzs"></div>
  <div id="side"></div>
</div>

<dialog id="lb">
  <div id="lbh"><input id="lq" placeholder="Search quote, comment, #tag or book…">
    <select id="lk"></select>
    <button id="lcp">Copy shown (Markdown)</button><button id="lex" title="Writes notes_export.md, library.bib, library.json into books/">Export .md + .bib + .json</button><button id="lx">Close</button></div>
  <div id="ll"></div>
</dialog>
<div id="dock">
  <div id="rp" hidden>
    <button id="rpp" title="Play / pause (P)">⏸</button><button id="rpb" title="Previous page">⏮</button><button id="rpn" title="Next page">⏭</button>
    <button id="rpr" title="Reverse direction">⇄</button>
    <button id="rps" title="Slower">−</button><b id="rpt">8s</b><button id="rpf" title="Faster">+</button>
    <select id="rpk" title="Which pages to cycle through"></select>
    <label title="Read the highlights and comments aloud (Hindi voice for Devanagari)"><input type="checkbox" id="rpa"> 🔊</label>
    <span id="rpi" style="color:#777"></span><button id="rpx">✕</button>
  </div>
  <div id="dk">
    <button id="tmb" title="Study timer — start/pause. Logged per book.">⏱ <span id="tmv">00:00:00</span> ▶</button>
    <button id="stb" title="Study log: today, streak, per book">📊</button>
    <button id="rapb" title="Rapid revision: auto-flip through your marked pages">▶ Rapid</button>
    <button id="pstb" title="Paste clipboard as a note on this page (⌘⇧V)">📋 Paste note</button>
  </div>
</div>
<dialog id="sd"><h3 style="margin-top:0">Study log</h3><div id="sdb"></div><p><button id="sdx">Close</button></p></dialog>
<dialog id="rv" style="width:720px;height:70vh">
  <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center">
    <select id="rs"><option value="book">This book</option><option value="all">All books</option></select>
    <select id="rk"></select>
    <span id="rn" style="flex:1;color:#777"></span>
    <button id="ranki" title="Writes anki_cloze.txt + anki_basic.txt into books/ for Anki's File → Import">Export Anki</button>
    <button id="rx">Close</button></div>
  <div id="rc" style="height:calc(100% - 130px);overflow:auto;font-size:18px;line-height:1.5;padding:12px;border:1px solid #ddd;border-radius:8px"></div>
  <div id="rb" style="display:flex;gap:6px;margin-top:10px;justify-content:center;flex-wrap:wrap"></div>
</dialog>
<dialog id="kd">
  <h3 style="margin-top:0">Highlight colours</h3>
  <div id="krows"></div>
  <p style="color:#777;margin:6px 0">Pick a colour and say what it means. Highlights already made keep their colour.</p>
  <button id="kadd">+ Colour</button> <button id="ksave">Save</button> <button id="kx">Close</button>
</dialog>
<dialog id="sr">
  <div id="srh" style="display:flex;gap:6px;margin-bottom:8px">
    <input id="sq" style="flex:1" placeholder="Phrases separated by commas — e.g. heart failure, ACE inhibitor, MI">
    <select id="ss"><option value="book">This book</option><option value="all">All indexed books</option></select>
    <button id="sx">Close</button></div>
  <div id="so">
    <select id="smode" title="any = a sentence with any phrase; all = only pages containing every phrase"><option value="any">any phrase</option><option value="all">all phrases on page</option></select>
    <label><input type="checkbox" id="scase"> Aa case</label>
    <label><input type="checkbox" id="swhole"> whole word</label>
    <label>context <select id="sctx"><option value="0">none</option><option value="1" selected>±1</option><option value="2">±2</option></select></label>
    <button id="sclr" title="Remove the search highlights from the pages">Clear page highlights</button>
  </div>
  <div id="sch"></div>
  <div id="sm" style="color:#777;margin-bottom:6px"></div>
  <div id="sl" style="overflow:auto;flex:1"></div>
</dialog>
<div id="hb" hidden><span id="hbc"></span><button id="hp">◀</button><b id="hn"></b><button id="hx2">▶</button><button id="hc" title="Clear search highlights">✕</button></div>
<dialog id="bi">
  <h3 style="margin-top:0">Book info</h3>
  <div id="bif"></div>
  <p style="color:#777;margin:6px 0">Authors as <i>Last, First and Last, First</i>. Fetch fills the rest from the DOI (free Crossref lookup).</p>
  <button id="bis">Save</button> <button id="bix">Close</button> <span id="bim"></span>
</dialog>

<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PDF Notes"><script src="vendor/pdf.min.js"></script><script src="vendor/pdf-lib.min.js"></script><script src="shim.js"></script><script>
const $ = id => document.getElementById(id);
const DK = [['#ffe14d', 'key fact'], ['#7ddf64', 'exam'], ['#ff9ac1', 'doubt'], ['#7cc7ff', 'definition']];
let prefs = {kinds: DK.map(k => [...k]), pg: {}, at: {}, theme: ''}, meta = {}, st = {}, toc = [], notes = [], sizes = [], cur = 0, tool = 'hl', act = null, tmp = null, width = 900, timer, ver = 0, raf = 0, sure = 0;
const pgs = [], wordsP = {};
let sh = null, shFil = new Set(), shLast = null; // sh: live search overlay {q, pages, list, rects}
const SC = ['#ffe14d', '#7cc7ff', '#7ddf64', '#ff9ac1', '#ffb454', '#c3a6ff'];
const api = (u, b) => fetch(u, {method: 'POST', headers: {'X-App': '1'}, body: JSON.stringify(b || {})}).then(r => r.json());
const setImg = window.setImg || ((img, kind, i) => { img.src = `/${kind}/${i}.png?v=${ver}`; }); // iPad build renders pages itself
const status = t => { $('st').textContent = t; };
const sorted = () => notes.slice().sort((a, b) => a.page - b.page || a.id - b.id);
const area = r => (r[2] - r[0]) * (r[3] - r[1]);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const inside = (r, p) => p[0] >= r[0] && p[0] <= r[2] && p[1] >= r[1] && p[1] <= r[3];

// lazy-load page images as they approach the viewport
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  const img = e.target.querySelector('img');
  if (!img.src) setImg(img, 'page', e.target.dataset.i);
  if (sh) loadHits(+e.target.dataset.i);
}), {root: $('view'), rootMargin: '1500px 0px'});

const thumbIO = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  const img = e.target.querySelector('img');
  if (!img.src) setImg(img, 'thumb', e.target.dataset.i);
}), {root: $('thumbs'), rootMargin: '400px 0px'});
function renderThumbs() {
  const host = $('thumbs');
  host.innerHTML = ''; thumbIO.disconnect();
  sizes.forEach(([w, h], i) => {
    const d = document.createElement('div');
    d.className = 'th'; d.dataset.i = i; d.style.aspectRatio = w + '/' + h;
    d.innerHTML = `<img alt=""><span>${i + 1}</span>`;
    d.onclick = () => go(i);
    host.appendChild(d); thumbIO.observe(d);
  });
  markThumbs();
}
function markThumbs() {
  const bp = new Set(toc.map(e => e[2] - 1));
  [...$('thumbs').children].forEach((d, i) => {
    d.classList.toggle('cur', i === cur);
    let b = d.querySelector('b');
    if (bp.has(i) && !b) { b = document.createElement('b'); b.textContent = '★'; d.appendChild(b); }
    else if (!bp.has(i) && b) b.remove();
  });
  const t = $('thumbs').children[cur];
  if (t && !$('thumbs').hidden) t.scrollIntoView({block: 'nearest'});
}
function renderBm() {
  const el = $('bml');
  el.innerHTML = toc.length ? '' : '<p style="color:#777">No bookmarks yet. Press ＋ or ⌘D to bookmark the page you are on.</p>';
  toc.forEach((e, i) => {
    const d = document.createElement('div');
    d.className = 'bm'; d.style.paddingLeft = (4 + (e[0] - 1) * 12) + 'px';
    d.innerHTML = `<span class="t" title="${esc(e[1])} (double-click to rename)">${esc(e[1])}</span><small>${e[2]}</small><button title="Delete">✕</button>`;
    d.onclick = ev => { if (ev.target.tagName === 'BUTTON') bm({op: 'del', index: i}); else go(e[2] - 1); };
    const t = d.querySelector('.t');
    t.ondblclick = ev => {
      ev.stopPropagation(); t.contentEditable = true; t.focus();
      t.onkeydown = k => { if (k.key === 'Enter') { k.preventDefault(); t.blur(); } };
      t.onblur = () => { t.contentEditable = false; const v = t.textContent.trim(); if (v && v !== e[1]) bm({op: 'rename', index: i, title: v}); else renderBm(); };
    };
    el.appendChild(d);
  });
}
async function bm(q) {
  toc = (await api('/api/bookmark', q)).toc;
  renderBm(); markThumbs();
}
// a highlight and its comment travel as one unit: quote + comment
const kind = c => (prefs.kinds.find(k => k[0] === c) || [])[1] || '';
let prefT = 0;

  rc.innerHTML = `<small style="color:#777">${esc(bt(rcur.b).slice(0, 60))} · p.${rcur.n.page + 1}${kind(rcur.n.hc) ? ' · ' + kind(rcur.n.hc) : ''}</small>` + cardHtml(rcur.n, false);
  rb.innerHTML = '<button id="rshow">Show answer (space)</button>';

}
function reveal() {
  if (!rcur || rshow) return;

    const c = rcur; $('rv').close();

  };
}
async function rate(conf) {
  const c = rcur, card = {conf, due: today() + DAYS[conf], seen: ((c.n.card || {}).seen || 0) + 1};
  c.n.card = card;
  if (c.b.book === st.name) { const m = notes.find(x => x.id === c.n.id); if (m) { m.card = card; save(); } }
  else await api('/api/card', {book: c.b.book, id: c.n.id, card});
  if (conf === 1) rq.push(c);
  nextCard();
}

$('ranki').onclick = async e => {
  const k = $('rk').value, cl = [], ba = [];

      const src = `${bt(b)} p.${n.page + 1}`;
      if (isQ(n)) return ba.push([f(n.text), f(n.quote + '<br><small>' + src + '</small>'), tags].join('\t'));
      const {toks, pick} = clozeOf(n.quote || n.text); let j = 0;

    });

// ---- rapid revision player ----
let rpL = [], rpI = 0, rpT = 0, rpOn = false, rpDir = 1;
const rpSec = () => prefs.rapidSec || 8;
function rpSource() {
  const k = $('rpk').value;
  if (k === '*') return pgs.map((_, i) => i);
  return [...new Set(notes.filter(n => n.hl && (!k || n.hc === k)).map(n => n.page))].sort((a, b) => a - b);
}
function rpShow() {
  if (!rpL.length) { $('rpi').textContent = 'no marked pages'; return rpStop(); }
  rpI = Math.max(0, Math.min(rpL.length - 1, rpI));
  go(rpL[rpI]);
  $('rpi').textContent = `${rpI + 1}/${rpL.length} · ${Math.round((rpDir > 0 ? rpL.length - rpI - 1 : rpI) * rpSec() / 6) / 10} min left`;
  if ($('rpa').checked) {
    const t = notes.filter(n => n.page === rpL[rpI]).sort((a, b) => a.id - b.id).map(n => [n.quote, n.text].filter(Boolean).join('. ')).join('. ');
    api('/api/say', {text: t});
  }
}
function rpTick() {
  clearTimeout(rpT);
  if (!rpOn) return;
  rpT = setTimeout(() => {
    const nx = rpI + rpDir;
    if (nx < 0 || nx >= rpL.length) return rpStop();
    rpI = nx; rpShow(); rpTick();
  }, rpSec() * 1000);
}
function rpStart() {
  if (!st.open) return;
  $('rp').hidden = false;
  rpL = rpSource();
  rpI = Math.max(0, rpL.findIndex(p => p >= cur)); if (rpI < 0 || (rpL.length && rpL[rpI] < cur)) rpI = 0;
  rpOn = true; $('rpp').textContent = '⏸'; rpShow(); rpTick();
}
function rpStop() { rpOn = false; clearTimeout(rpT); $('rpp').textContent = '▶'; api('/api/say', {text: ''}); }
$('rapb').onclick = () => {
  $('rpk').innerHTML = '<option value="">Highlighted pages</option>' + prefs.kinds.map(([c, k]) => `<option value="${c}">only ${esc(k)}</option>`).join('') + '<option value="*">Every page</option>';
  $('rpt').textContent = rpSec() + 's'; rpStart();
};
$('rpp').onclick = () => { if (rpOn) rpStop(); else { rpOn = true; $('rpp').textContent = '⏸'; rpTick(); } };
$('rpn').onclick = () => { rpI++; rpShow(); rpTick(); };
$('rpb').onclick = () => { rpI--; rpShow(); rpTick(); };
$('rpr').onclick = () => { rpDir = -rpDir; $('rpr').style.background = rpDir < 0 ? '#ffd95a' : ''; };
$('rpf').onclick = () => { prefs.rapidSec = Math.max(2, rpSec() - 2); $('rpt').textContent = rpSec() + 's'; savePrefs(); rpTick(); };
$('rps').onclick = () => { prefs.rapidSec = rpSec() + 2; $('rpt').textContent = rpSec() + 's'; savePrefs(); rpTick(); };
$('rpk').onchange = () => { rpL = rpSource(); rpI = 0; rpShow(); rpTick(); };
$('rpx').onclick = () => { rpStop(); $('rp').hidden = true; };

// ---- study timer (logged per book) ----
const tm = {run: false, t0: 0, acc: 0, book: ''};
const tmEl = () => tm.acc + (tm.run ? (Date.now() - tm.t0) / 1000 : 0);
const tmFlush = () => { // log the running stretch to the book it was spent on
  if (!tm.run) return;
  const now = Date.now(), secs = (now - tm.t0) / 1000;
  tm.acc += secs; tm.t0 = now;
  fetch('/api/study', {method: 'POST', keepalive: true, headers: {'X-App': '1'}, body: JSON.stringify({book: tm.book, secs})});
};
$('tmb').onclick = () => {
  if (tm.run) { tmFlush(); tm.run = false; }
  else { tm.run = true; tm.t0 = Date.now(); tm.book = st.name || ''; }
  $('tmb').lastChild.textContent = tm.run ? ' ⏸' : ' ▶';
};
setInterval(() => { $('tmv').textContent = new Date(tmEl() * 1000).toISOString().substr(11, 8); }, 500);

  const mx = Math.max(1, ...r.week.map(w => w[1]));

    + r.week.map(([d, s]) => `<div style="display:flex;gap:6px;align-items:center"><span style="width:84px">${d.slice(5)}</span><span style="height:10px;background:#3b82f6;width:${Math.round(s / mx * 200)}px;border-radius:3px"></span> ${s ? h(s) : ''}</div>`).join('')
    + '<h4>By book</h4>' + (r.books.map(([b, s]) => `<div>${esc(b.replace(/\.pdf$/, '').slice(0, 60))} — ${h(s)}</div>`).join('') || '<small>nothing yet</small>');

async function pasteNote() {
  if (!st.open) return;
  let t = '';
  try { t = (await navigator.clipboard.readText()).trim(); } catch (e) { return status('allow clipboard access to paste a note'); }
  if (!t) return status('clipboard is empty');
  const n = {id: Date.now(), page: cur, text: t, ink: [], rect: [0.04, 0.02, 0.2, 0.05]};
  notes.push(n); act = n.id; save(); drawAll(); side(); renderNotes();
  status('pasted as a note on p.' + (cur + 1));
}

document.onkeydown = e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowLeft') go(cur - 1);
  else if (e.key === 'ArrowRight') go(cur + 1);
  else if ((e.metaKey || e.ctrlKey) && e.key === 'z') undo();
  else if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === 'v') { e.preventDefault(); pasteNote(); }
  else if (e.key === 'p' && !$('rp').hidden) $('rpp').click();
  else if ((e.metaKey || e.ctrlKey) && e.key === 'd') { e.preventDefault(); addBm(); }
};

  const set=v=>{document.body.classList.toggle(k,v);e.classList.toggle("on",!v);try{localStorage[k]=v?1:""}catch(_){}};
  set(!!(()=>{try{return localStorage[k]}catch(_){}})());

}

<script>
// drag a handle to resize its panel; width remembered
for(const [h,p,dir,k] of [["rzn","nav",1,"wnav"],["rzs","side",-1,"wside"]]){
  const P=document.getElementById(p),H=document.getElementById(h);
  try{if(localStorage[k])P.style.width=localStorage[k]+"px"}catch(_){}
  H.onpointerdown=e=>{
    const x0=e.clientX,w0=P.offsetWidth;H.setPointerCapture(e.pointerId);H.classList.add("d");
    H.onpointermove=m=>{P.style.width=Math.max(120,Math.min(800,w0+dir*(m.clientX-x0)))+"px"};
    H.onpointerup=()=>{H.onpointermove=H.onpointerup=null;H.classList.remove("d");try{localStorage[k]=P.offsetWidth}catch(_){}};
  };
}
</script>
